<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/sarkovialogo.png">
  <link rel="stylesheet" href="/admin-theme.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 58px;
      background: rgba(15,4,10,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      border-radius: 6px;
    }
    header h1 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0;
      color: #fff;
      letter-spacing: 0.2px;
    }
    header .right { display: flex; align-items: center; gap: 12px; }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 5px 12px 5px 10px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .user-chip .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }
    header button.logout {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    header button.logout:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .wrap { max-width: 1020px; margin: 0 auto; padding: 32px 24px 100px; }

    #accessMsg {
      text-align: center;
      color: var(--text-dim);
      padding: 80px 20px;
      font-size: 0.95rem;
    }

    .section-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.25);
      margin: 28px 0 10px;
    }

    .owner-panel {
      background: rgba(20,8,14,0.55);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 22px 24px;
      margin-bottom: 28px;
    }
    .owner-panel h2 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.5);
      margin: 0 0 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .owner-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .code-box {
      display: none;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 8px 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      color: var(--accent);
      letter-spacing: 1.5px;
    }

    .code-list { margin-top: 16px; max-height: 140px; overflow-y: auto; }
    .code-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--text-dim);
    }
    .code-row code { color: var(--text); font-size: 0.82rem; letter-spacing: 1px; }
    .code-row .used { color: rgba(255,255,255,0.3); }
    .code-row .unused { color: #22c46e; font-weight: 600; }

    .owner-divider {
      height: 1px;
      background: rgba(180,30,60,0.2);
      margin: 20px 0;
    }

    .owner-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(255,255,255,0.3);
      margin: 0 0 12px;
    }

    button.danger {
      background: rgba(224,97,92,0.08);
      border: 1px solid rgba(224,97,92,0.4);
      color: var(--red);
      padding: 9px 18px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button.danger:hover {
      background: rgba(224,97,92,0.16);
      border-color: var(--red);
    }

    .tabs, .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .tab-btn, .filter-btn {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.45);
      padding: 7px 16px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      letter-spacing: 0.2px;
    }
    .tab-btn.active {
      background: rgba(224,97,92,0.14);
      color: #f0918d;
      border-color: rgba(224,97,92,0.5);
    }
    .filter-btn.active {
      background: rgba(91,140,255,0.14);
      color: #8fabf5;
      border-color: rgba(91,140,255,0.4);
    }
    .count-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      font-size: 0.72rem;
      font-weight: 700;
    }
    .filter-btn.active .count-badge {
      background: rgba(255,255,255,0.18);
    }
    .tab-btn:hover:not(.active), .filter-btn:hover:not(.active) {
      border-color: rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.06);
    }

    #loadingMsg, #emptyMsg {
      text-align: center;
      color: rgba(255,255,255,0.25);
      padding: 70px 20px;
      font-size: 0.95rem;
    }

    .group-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(255,255,255,0.4);
      margin: 28px 0 12px;
    }

    .card {
      background: rgba(24,10,17,0.7);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 20px 22px;
      margin-bottom: 14px;
      transition: border-color 0.15s;
    }
    .card:hover {
      border-color: rgba(255,255,255,0.18);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card-id { display: flex; align-items: center; gap: 12px; }

    .type-badge {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .type-badge.written {
      background: rgba(88,101,242,0.2);
      color: #a0aaff;
      border: 1px solid rgba(88,101,242,0.4);
    }
    .type-badge.video {
      background: rgba(230,126,34,0.15);
      color: #f0a060;
      border: 1px solid rgba(230,126,34,0.35);
    }

    .app-number {
      font-family: 'Inter', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.3px;
    }
    .card-id .ign { font-weight: 800; color: #fff; font-size: 1.05rem; letter-spacing: 0.2px; }
    .card-id .ign.hidden-id { color: rgba(255,255,255,0.3); font-weight: 500; font-style: italic; font-size: 0.85rem; }
    .card-id .discord { color: rgba(255,255,255,0.4); font-size: 0.82rem; margin-top: 2px; }

    .score-pill {
      background: rgba(217,165,92,0.08);
      border: 1px solid rgba(217,165,92,0.3);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.82rem;
      color: var(--amber);
      font-weight: 600;
      white-space: nowrap;
    }

    .field-row { margin-bottom: 14px; }
    .field-row label {
      display: block;
      font-size: 0.63rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 5px;
    }
    .field-row p {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: rgba(255,255,255,0.8);
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .field-row a { color: #7aaeff; word-break: break-all; }
    .field-row p.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .show-more-btn {
      background: none;
      border: none;
      padding: 0;
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--amber);
      cursor: pointer;
      text-decoration: underline;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .rate-boxes { display: flex; gap: 5px; flex-wrap: wrap; }
    .rate-box {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .rate-box:hover { border-color: rgba(255,255,255,0.35); }
    .rate-box.selected {
      background: rgba(91,140,255,0.2);
      border-color: var(--accent);
      color: #8fabf5;
    }

    button.action {
      padding: 9px 18px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.5);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      letter-spacing: 0.2px;
    }
    button.action:hover { border-color: rgba(255,255,255,0.3); color: #fff; background: rgba(255,255,255,0.08); }

    button.action.accept {
      background: rgba(76,175,125,0.15);
      color: #6ecb9c;
      border-color: rgba(76,175,125,0.4);
    }
    button.action.accept:hover {
      background: rgba(76,175,125,0.24);
      color: #85dbaf;
    }
    button.action.deny {
      background: rgba(224,97,92,0.13);
      color: #ea8f8b;
      border-color: rgba(224,97,92,0.4);
    }
    button.action.deny:hover {
      background: rgba(224,97,92,0.22);
      color: #f0a5a1;
    }
    button.action.remove-staff {
      background: rgba(224,97,92,0.08);
      color: #e0857f;
      border-color: rgba(224,97,92,0.3);
      font-size: 0.75rem;
      padding: 5px 13px;
    }
    button.action.remove-staff:hover {
      background: rgba(224,97,92,0.16);
      border-color: rgba(224,97,92,0.5);
    }

    .meta-line { font-size: 0.72rem; color: rgba(255,255,255,0.3); margin-top: 10px; }

    .status-tag {
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 5px;
      letter-spacing: 0.8px;
    }
    .status-tag.accepted {
      background: rgba(22,168,92,0.15);
      color: #22c46e;
      border: 1px solid rgba(22,168,92,0.3);
    }
    .status-tag.denied {
      background: rgba(220,40,40,0.12);
      color: #ff6b6b;
      border: 1px solid rgba(220,40,40,0.3);
    }

    .owner-sort-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      padding: 10px 20px;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .owner-sort-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.3);
    }
    .owner-sort-btn.locked {
      background: rgba(217,165,92,0.08);
      border: 1px solid rgba(217,165,92,0.3);
      color: var(--amber);
      cursor: default;
    }

    .sorted-banner {
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(217,165,92,0.08);
      border: 1px solid rgba(217,165,92,0.25);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 20px;
    }
    .sorted-banner.visible { display: flex; }
    .sorted-banner-text strong {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--amber);
      margin-bottom: 2px;
    }
    .sorted-banner-text span {
      font-size: 0.75rem;
      color: rgba(217,165,92,0.7);
    }

    .search-row { margin-bottom: 16px; }
    .search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.3); }
    .search-input:focus { border-color: var(--accent); }
  </style>
</head>

<body>

<header>
  <div class="header-logo">
    <img src="/sarkovialogo.png" alt="logo">
    <h1>Staff Dashboard</h1>
  </div>
  <div class="right">
    <div class="user-chip" id="userLabel" style="display:none;">
      <span class="dot"></span>
      <span id="userLabelText"></span>
    </div>
    <button class="logout" id="logoutBtn" style="display:none;">Log out</button>
  </div>
</header>

<div class="wrap">

  <div id="accessMsg" style="display:none;"></div>

  <div id="dashboard" style="display:none;">

    <div class="owner-panel" id="ownerPanel" style="display:none;">
      <h2>Owner Tools</h2>
      <div class="owner-row">
        <button class="tab-btn" id="genCodeBtn">Generate Invite Code</button>
        <div class="code-box" id="newCodeBox"></div>
      </div>
      <div class="code-list" id="codeList"></div>

      <div class="owner-divider"></div>

      <div class="owner-section-title">Sort Applications</div>
      <button class="owner-sort-btn" id="sortBtn">Sort by Rating (High → Low)</button>

      <div class="owner-divider"></div>

      <div class="owner-section-title">Staff Accounts</div>
      <div id="staffList" style="margin-bottom:16px;"></div>

      <div class="owner-divider"></div>

      <button class="danger" id="clearBtn">Wipe All Applications</button>

      <div id="flaggedDivider" class="owner-divider" style="display:none;"></div>
      <div id="flaggedSection" style="display:none;">
        <div class="owner-section-title" style="color:#ff8080;">Flagged Accounts</div>
        <div id="flaggedList"></div>
      </div>
    </div>
    <div class="search-row">
    <input type="text" id="searchInput" class="search-input" placeholder="Enter application number #" inputmode="numeric" autocomplete="off">
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-status="pending">Pending</button>
      <button class="tab-btn" data-status="accepted">Accepted</button>
      <button class="tab-btn" data-status="denied">Denied</button>
      <button class="tab-btn" data-status="all">All</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-type="all">All Types</button>
      <button class="filter-btn" data-type="written">Written</button>
      <button class="filter-btn" data-type="video">Video</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-rated="all">All <span class="count-badge" id="countAllBadge">0</span></button>
      <button class="filter-btn" data-rated="no">Unrated by Me <span class="count-badge" id="countUnratedBadge">0</span></button>
      <button class="filter-btn" data-rated="yes">Rated by Me <span class="count-badge" id="countRatedBadge">0</span></button>
    </div>

    <div class="filters" id="ratingCountFilters"></div>

    <div class="sorted-banner" id="sortedBanner">
      <div class="sorted-banner-text">
        <strong>Applications Sorted</strong>
        <span>Rated highest to lowest. Accept or deny below.</span>
      </div>
    </div>

    <div id="loadingMsg">Loading applications…</div>
    <div id="emptyMsg" style="display:none;">No applications here.</div>
    <div id="list"></div>
  </div>

</div>

<script>
let currentStatus = "pending";
let currentType = "all";
let currentRated = "all";
let currentRatingCount = "all";
let sortedView = false;
let lastApps = [];
let searchQuery = "";

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  const data = await res.json();
  return { ok: res.ok, data };
}

async function init() {
  const res = await fetch("/api/admin/me");
  const me = await res.json();

  if (!me.loggedIn) {
    document.getElementById("accessMsg").style.display = "block";
    document.getElementById("accessMsg").innerHTML =
      `Please <a href="/admin/login">log in</a> to continue.`;
    return;
  }

  document.getElementById("userLabel").style.display = "flex";
  document.getElementById("userLabelText").textContent = `${me.username} · ${me.role}`;
  document.getElementById("logoutBtn").style.display = "inline-block";
  document.getElementById("dashboard").style.display = "block";

  if (me.isOwner) {
    document.getElementById("ownerPanel").style.display = "block";
    loadInviteCodes();
    loadStaffList();
    loadFlagged();
  }

  await loadSortStatus();
  loadApplications();
}

// pulled from the server so it survives a refresh
async function loadSortStatus() {
  const res = await fetch("/api/staff/sort-status");
  if (!res.ok) return;
  const data = await res.json();
  sortedView = !!data.sorted;
  applySortedUi();
}

function applySortedUi() {
  const btn = document.getElementById("sortBtn");
  const banner = document.getElementById("sortedBanner");
  if (sortedView) {
    btn.textContent = "Sorted — Decision Mode Active";
    btn.classList.add("locked");
    btn.disabled = true;
    banner.classList.add("visible");
  } else {
    btn.textContent = "Sort by Rating (High → Low)";
    btn.classList.remove("locked");
    btn.disabled = false;
    banner.classList.remove("visible");
  }
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await fetch("/api/admin/logout", { method: "POST" });
  window.location.href = "/admin/login";
});

document.querySelectorAll("[data-status]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-status]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentStatus = btn.dataset.status;
    clearSearch();
    loadApplications();
  });
});

document.querySelectorAll("[data-type]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-type]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.dataset.type;
    clearSearch();
    loadApplications();
  });
});

document.querySelectorAll("[data-rated]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-rated]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentRated = btn.dataset.rated;
    clearSearch();
    loadApplications();
  });
});

function clearSearch() {
  searchQuery = "";
  document.getElementById("searchInput").value = "";
}

document.getElementById("searchInput").addEventListener("input", () => {
  searchQuery = document.getElementById("searchInput").value.trim();
  if (searchQuery) {
    searchApplications(searchQuery);
  } else {
    loadApplications();
  }
});

async function searchApplications(query) {
  const list = document.getElementById("list");
  const loading = document.getElementById("loadingMsg");
  const empty = document.getElementById("emptyMsg");

  const num = parseInt(query, 10);
  if (isNaN(num)) {
    list.innerHTML = "";
    loading.style.display = "none";
    empty.textContent = "Enter a valid application number.";
    empty.style.display = "block";
    return;
  }

  loading.style.display = "block";
  empty.style.display = "none";
  list.innerHTML = "";

  const res = await fetch(`/api/staff/applications?status=all&type=all`);
  const data = await res.json();
  loading.style.display = "none";

  // bail if the search box changed while this was still loading
  if (searchQuery !== query) return;

  const apps = (data.applications || []).filter(a => Number(a.seq_num) === num);
  lastApps = apps;
  updateRatedCounts(apps);

  if (!apps.length) {
    empty.textContent = "No application found with that number.";
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";
  list.innerHTML = apps.map(renderCard).join("");
  wireCardButtons();
}

document.getElementById("sortBtn").addEventListener("click", async () => {
  if (sortedView) return;
  if (!confirm("Sort applications by rating?\n\nDo this once everyone has finished rating.")) return;

  const { ok, data } = await postJSON("/api/staff/sort");
  if (!ok) {
    alert("Failed to sort: " + (data.error || "unknown error"));
    return;
  }

  sortedView = true;
  applySortedUi();
  renderList(lastApps);
});

document.getElementById("genCodeBtn").addEventListener("click", async () => {
  const { ok, data } = await postJSON("/api/admin/generate-code");
  if (!ok) { alert(data.error || "Failed to generate code"); return; }

  const box = document.getElementById("newCodeBox");
  box.textContent = data.code;
  box.style.display = "inline-block";
  loadInviteCodes();
});

document.getElementById("clearBtn").addEventListener("click", async () => {
  if (!confirm("Wipe all applications and ratings? This can't be undone.")) return;

  const phrase = prompt('Type "DELETE ALL APPLICATIONS" to confirm:');
  if (phrase !== "DELETE ALL APPLICATIONS") {
    alert("Didn't match — nothing was deleted.");
    return;
  }

  const { ok, data } = await postJSON("/api/admin/clear-apps", { confirmation: phrase });
  if (!ok) { alert("Failed: " + (data.error || "unknown error")); return; }

  alert("All applications and ratings have been cleared.");
  loadApplications();
});

async function loadStaffList() {
  const res = await fetch("/api/admin/staff-list");
  if (!res.ok) return;
  const data = await res.json();
  const el = document.getElementById("staffList");
  if (!data.staff.length) { el.innerHTML = '<p class="meta-line">No staff accounts yet.</p>'; return; }
  el.innerHTML = data.staff.map(s => `
    <div class="code-row" style="padding:8px 0;">
      <span><code>${escapeHtml(s.username)}</code> <span class="used" style="margin-left:6px;">${s.role}</span> <span class="count-badge" title="Applications rated">${s.rated_count}</span></span>
      <button class="action remove-staff" data-staff-id="${s.id}" data-staff-name="${escapeHtml(s.username)}">Remove</button>
    </div>
  `).join("");
  el.querySelectorAll("[data-staff-id]").forEach(btn => {
    btn.addEventListener("click", () => removeStaff(btn.dataset.staffId, btn.dataset.staffName));
  });
}

async function loadFlagged() {
  const res = await fetch("/api/staff/flagged");
  if (!res.ok) return;
  const data = await res.json();
  const clusters = data.clusters || [];

  const divider = document.getElementById("flaggedDivider");
  const section = document.getElementById("flaggedSection");

  if (!clusters.length) {
    divider.style.display = "none";
    section.style.display = "none";
    return;
  }

  divider.style.display = "block";
  section.style.display = "block";

  document.getElementById("flaggedList").innerHTML = clusters.map(c => {
    const signalLabel = c.signals.device && c.signals.ign
      ? "Device + IGN"
      : c.signals.device ? "Device" : "Reused IGN";
    const rows = c.applications.map(a => `
      <div class="code-row" style="padding:6px 0;">
        <span>#${String(a.seq_num).padStart(3, "0")} — <code>${escapeHtml(a.ign)}</code> — @${escapeHtml(a.discord_username)} — ${a.type} — ${a.status}</span>
      </div>
    `).join("");
    return `
      <div style="margin-bottom:14px; padding:10px 12px; background:rgba(255,80,80,0.06); border:1px solid rgba(255,80,80,0.25); border-radius:8px;">
        <div style="font-size:0.72rem; font-weight:700; color:#ff8080; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Matched by: ${signalLabel}</div>
        ${rows}
      </div>
    `;
  }).join("");
}

async function removeStaff(id, name) {
  if (!confirm(`Remove ${name}?`)) return;
  const { ok, data } = await postJSON("/api/admin/remove-staff", { staffId: id });
  if (!ok) { alert("Failed: " + (data.error || "unknown error")); return; }
  loadStaffList();
}

async function loadInviteCodes() {
  const res = await fetch("/api/admin/invite-codes");
  if (!res.ok) return;
  const data = await res.json();
  document.getElementById("codeList").innerHTML = data.codes.map(c => `
    <div class="code-row">
      <code>${c.code}</code>
      <span class="${c.used_at ? 'used' : 'unused'}">${c.used_at ? 'Used by ' + escapeHtml(c.used_by) : 'Unused'}</span>
    </div>
  `).join("");
}

async function loadApplications() {
  const list = document.getElementById("list");
  const loading = document.getElementById("loadingMsg");
  const empty = document.getElementById("emptyMsg");

  loading.style.display = "block";
  empty.style.display = "none";
  empty.textContent = "No applications here.";
  list.innerHTML = "";

  // leave out the rated filter here so the counts stay accurate, it gets applied later in renderList
  const url = `/api/staff/applications?status=${currentStatus}&type=${currentType}`;

  const res = await fetch(url);
  const data = await res.json();
  loading.style.display = "none";

  lastApps = data.applications || [];
  updateRatedCounts(lastApps);
  updateRatingCountFilters(lastApps);
  renderList(lastApps);
}

function updateRatedCounts(apps) {
  const ratedCount = apps.filter(a => a.my_score !== null && a.my_score !== undefined).length;
  document.getElementById("countAllBadge").textContent = apps.length;
  document.getElementById("countRatedBadge").textContent = ratedCount;
  document.getElementById("countUnratedBadge").textContent = apps.length - ratedCount;
}

function updateRatingCountFilters(apps) {
  const counts = {};
  apps.forEach(a => counts[a.rating_count] = (counts[a.rating_count] || 0) + 1);
  const values = Object.keys(counts).map(Number).sort((a, b) => a - b);

  const el = document.getElementById("ratingCountFilters");
  el.innerHTML = `<button class="filter-btn${currentRatingCount === "all" ? " active" : ""}" data-ratingcount="all">All Rating Counts</button>` +
    values.map(v => `<button class="filter-btn${currentRatingCount === String(v) ? " active" : ""}" data-ratingcount="${v}">${v} rating${v !== 1 ? "s" : ""} <span class="count-badge">${counts[v]}</span></button>`).join("");

  el.querySelectorAll("[data-ratingcount]").forEach(btn => {
    btn.addEventListener("click", () => {
      currentRatingCount = btn.dataset.ratingcount;
      updateRatingCountFilters(lastApps);
      renderList(lastApps);
    });
  });
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderList(rawApps) {
  const list = document.getElementById("list");
  const empty = document.getElementById("emptyMsg");

  let apps = currentRated === "all"
    ? rawApps
    : rawApps.filter(a => currentRated === "yes" ? (a.my_score !== null && a.my_score !== undefined) : (a.my_score === null || a.my_score === undefined));

  if (currentRatingCount !== "all") {
    apps = apps.filter(a => String(a.rating_count) === currentRatingCount);
  }

  if (!apps.length) {
    list.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  if (sortedView) {
    const written = apps.filter(a => a.type === "written").sort((a, b) => b.avg_score - a.avg_score);
    const video = apps.filter(a => a.type === "video").sort((a, b) => b.avg_score - a.avg_score);

    list.innerHTML = `
      <div class="group-title">Written — sorted by rating</div>
      ${written.length ? written.map(renderCard).join("") : '<p class="meta-line">None</p>'}
      <div class="group-title">Video — sorted by rating</div>
      ${video.length ? video.map(renderCard).join("") : '<p class="meta-line">None</p>'}
    `;
  } else {
    list.innerHTML = apps.map(renderCard).join("");
  }

  wireCardButtons();
}

function wireCardButtons() {
  document.querySelectorAll(".rate-boxes").forEach(box => {
    box.querySelectorAll(".rate-box").forEach(btn => {
      btn.addEventListener("click", () => {
        box.querySelectorAll(".rate-box").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        submitRating(box.dataset.app, parseInt(btn.dataset.n, 10));
      });
    });
  });
  document.querySelectorAll("[data-decide]").forEach(btn => {
    btn.addEventListener("click", () => decide(btn.dataset.decide, btn.dataset.decision));
  });
  wireExpandableFields();
}

function wireExpandableFields() {
  requestAnimationFrame(() => {
  document.querySelectorAll(".field-row p").forEach(p => {
    const lineHeight = parseFloat(getComputedStyle(p).lineHeight);
    const maxHeight = lineHeight * 4 + 1;
    if (p.scrollHeight <= maxHeight) return;

    p.classList.add("clamped");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "show-more-btn";
    btn.textContent = "Show more";
    btn.addEventListener("click", () => {
      const collapsed = p.classList.toggle("clamped");
      btn.textContent = collapsed ? "Show more" : "Show less";
    });
    p.insertAdjacentElement("afterend", btn);
  });
  });
}

function renderCard(app) {
  const isWritten = app.type === "written";
  const submitted = new Date(app.submitted_at).toLocaleString();

  const statusTag = app.status !== "pending"
    ? `<span class="status-tag ${app.status}">${app.status}</span>`
    : "";

  const ignDisplay = app.ign !== null
    ? `<span class="ign">${escapeHtml(app.ign)} ${statusTag}</span>`
    : `<span class="ign hidden-id">Hidden until decided ${statusTag}</span>`;
  const discordDisplay = app.discord_username !== null
    ? `<span class="discord">@${escapeHtml(app.discord_username)}</span>`
    : `<span class="discord">Hidden until decided</span>`;

  const fieldsHtml = isWritten ? `
    <div class="field-row"><label>About</label><p>${escapeHtml(app.about)}</p></div>
    <div class="field-row"><label>Plans</label><p>${escapeHtml(app.plans)}</p></div>
    <div class="field-row"><label>Experience</label><p>${escapeHtml(app.experience)}</p></div>
    <div class="field-row"><label>RP — The Gold Strike</label><p>${escapeHtml(app.rp2)}</p></div>
    <div class="field-row"><label>RP — The Showdown</label><p>${escapeHtml(app.rp3 || '')}</p></div>
  ` : `
    <div class="field-row"><label>Video Link</label><p><a href="${escapeHtml(app.video_link)}" target="_blank">${escapeHtml(app.video_link)}</a></p></div>
  `;

  const myRatingLabel = app.my_score
    ? `<span style="font-size:0.75rem;color:var(--accent);font-weight:600;">Your rating: ${app.my_score}/10</span>`
    : `<span style="font-size:0.75rem;color:var(--text-dim);">You haven't rated</span>`;

  const decideButtons = sortedView ? `
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="action accept" data-decide="${app.id}" data-decision="accept">Accept</button>
      <button class="action deny" data-decide="${app.id}" data-decision="deny">Deny</button>
    </div>` : "";

  const rateBoxes = Array.from({ length: 10 }, (_, i) => i + 1)
    .map(n => `<button type="button" class="rate-box${n === app.my_score ? " selected" : ""}" data-n="${n}">${n}</button>`)
    .join("");

  const actionsHtml = app.status === "pending" ? `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="rate-boxes" data-app="${app.id}">${rateBoxes}</div>
      ${myRatingLabel}
    </div>
    ${decideButtons}
  ` : `
    <span class="meta-line">Decided by ${escapeHtml(app.decided_by)} on ${new Date(app.decided_at).toLocaleString()}</span>
  `;

  return `
    <div class="card" id="card-${app.id}">
      <div class="card-top">
        <div class="card-id">
          <span class="app-number">#${String(app.seq_num).padStart(3, "0")}</span>
          <span class="type-badge ${app.type}">${isWritten ? "Written" : "Video"}</span>
          <div>
            <div>${ignDisplay}</div>
            <div>${discordDisplay}</div>
          </div>
        </div>
        <div class="score-pill">${sortedView
          ? `${Number(app.avg_score).toFixed(1)}/10 (${app.rating_count} rating${app.rating_count !== 1 ? "s" : ""})`
          : `${app.rating_count} rating${app.rating_count !== 1 ? "s" : ""}`
        }</div>
      </div>

      ${fieldsHtml}

      <div class="card-actions">
        ${actionsHtml}
      </div>
      <div class="meta-line">Submitted ${submitted}</div>
    </div>
  `;
}

async function submitRating(applicationId, score) {
  const { ok, data } = await postJSON("/api/staff/rate", { applicationId, score });
  if (!ok) {
    alert("Failed to rate: " + (data.error || "unknown error"));
    return;
  }

  loadApplications();
}

async function decide(applicationId, decision) {
  if (!confirm(`${decision === "accept" ? "Accept" : "Deny"} this application?`)) return;

  const { ok, data } = await postJSON("/api/staff/decide", { applicationId, decision });
  if (!ok) {
    alert("Failed: " + (data.error || "unknown error"));
    return;
  }
  if (data.warning) alert(data.warning);

  loadApplications();
}

init();
</script>
