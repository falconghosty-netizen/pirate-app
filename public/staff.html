<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/sarkovialogo.png">
  <link rel="stylesheet" href="/admin-theme.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Header ─────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 60px;
      background: rgba(10,0,8,0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(180,30,60,0.25);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 30px rgba(0,0,0,0.5);
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
    }
    header h1 {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, #fff 30%, #cc3355);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.3px;
    }
    header .right { display: flex; align-items: center; gap: 12px; }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 5px 14px 5px 10px;
      font-size: 0.8rem;
      color: var(--text);
    }
    .user-chip .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c46e;
      box-shadow: 0 0 6px #22c46e;
      flex-shrink: 0;
    }
    header button.logout {
      background: rgba(240,53,48,0.1);
      border: 1px solid rgba(240,53,48,0.3);
      color: rgba(240,100,96,0.9);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    header button.logout:hover {
      background: rgba(240,53,48,0.2);
      border-color: #f03530;
      color: #ff6b68;
    }

    /* ── Layout ─────────────────────────────────────── */
    .wrap { max-width: 1020px; margin: 0 auto; padding: 32px 24px 100px; }

    #accessMsg {
      text-align: center;
      color: var(--text-dim);
      padding: 80px 20px;
      font-size: 0.95rem;
    }

    /* ── Section labels ──────────────────────────────── */
    .section-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.25);
      margin: 28px 0 10px;
    }

    /* ── Owner panel ─────────────────────────────────── */
    .owner-panel {
      background: linear-gradient(145deg, rgba(80,0,30,0.45) 0%, rgba(30,0,15,0.6) 100%);
      border: 1px solid rgba(180,30,60,0.4);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 28px;
      box-shadow: 0 0 40px rgba(150,0,40,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
    }
    .owner-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(220,40,80,0.8), transparent);
    }
    .owner-panel h2 {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,80,110,0.9);
      margin: 0 0 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .owner-panel h2::before {
      content: '◆';
      font-size: 0.55rem;
    }

    .owner-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .code-box {
      display: none;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(91,140,255,0.5);
      border-radius: 8px;
      padding: 8px 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      color: #7aaeff;
      letter-spacing: 2px;
      box-shadow: 0 0 12px rgba(91,140,255,0.2);
    }

    .code-list { margin-top: 16px; max-height: 140px; overflow-y: auto; }
    .code-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--text-dim);
    }
    .code-row code { color: var(--text); font-size: 0.82rem; letter-spacing: 1px; }
    .code-row .used { color: rgba(255,255,255,0.3); }
    .code-row .unused { color: #22c46e; font-weight: 600; }

    .owner-divider {
      height: 1px;
      background: rgba(180,30,60,0.2);
      margin: 20px 0;
    }

    .owner-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(255,255,255,0.3);
      margin: 0 0 12px;
    }

    button.danger {
      background: linear-gradient(135deg, rgba(180,20,20,0.3), rgba(120,10,10,0.4));
      border: 1px solid rgba(240,53,48,0.5);
      color: #ff6b68;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
      box-shadow: 0 2px 12px rgba(240,53,48,0.2);
    }
    button.danger:hover {
      background: linear-gradient(135deg, rgba(200,30,30,0.4), rgba(150,15,15,0.5));
      box-shadow: 0 4px 20px rgba(240,53,48,0.35);
    }

    /* ── Filter/tab bar ──────────────────────────────── */
    .tabs, .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .tab-btn, .filter-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.45);
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      letter-spacing: 0.2px;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #cc2244, #e8304a);
      color: #fff;
      border-color: #e8304a;
      box-shadow: 0 2px 14px rgba(220,40,70,0.45);
    }
    .filter-btn.active {
      background: rgba(91,140,255,0.18);
      color: #7aaeff;
      border-color: rgba(91,140,255,0.5);
      box-shadow: 0 0 12px rgba(91,140,255,0.2);
    }
    .tab-btn:hover:not(.active), .filter-btn:hover:not(.active) {
      border-color: rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.07);
    }

    /* ── Cards ───────────────────────────────────────── */
    #loadingMsg, #emptyMsg {
      text-align: center;
      color: rgba(255,255,255,0.25);
      padding: 70px 20px;
      font-size: 0.95rem;
    }

    .group-title {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255,80,110,0.7);
      margin: 28px 0 12px;
    }

    .card {
      background: linear-gradient(160deg, rgba(30,12,20,0.9) 0%, rgba(18,8,14,0.95) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    .card:hover {
      border-color: rgba(180,30,60,0.35);
      box-shadow: 0 6px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(180,30,60,0.1);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card-id { display: flex; align-items: center; gap: 12px; }

    .type-badge {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .type-badge.written {
      background: rgba(88,101,242,0.2);
      color: #a0aaff;
      border: 1px solid rgba(88,101,242,0.4);
    }
    .type-badge.video {
      background: rgba(230,126,34,0.15);
      color: #f0a060;
      border: 1px solid rgba(230,126,34,0.35);
    }

    .card-id .ign { font-weight: 800; color: #fff; font-size: 1.05rem; letter-spacing: 0.2px; }
    .card-id .ign.hidden-id { color: rgba(255,255,255,0.3); font-weight: 500; font-style: italic; font-size: 0.85rem; }
    .card-id .discord { color: rgba(255,255,255,0.4); font-size: 0.82rem; margin-top: 2px; }

    .score-pill {
      background: rgba(255,220,80,0.08);
      border: 1px solid rgba(255,200,60,0.25);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.82rem;
      color: #ffd060;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 0 12px rgba(255,200,60,0.1);
    }

    .field-row { margin-bottom: 14px; }
    .field-row label {
      display: block;
      font-size: 0.63rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 5px;
    }
    .field-row p {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: rgba(255,255,255,0.8);
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .field-row a { color: #7aaeff; word-break: break-all; }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .rate-input {
      width: 60px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 700;
      outline: none;
      transition: border-color 0.18s;
    }
    .rate-input:focus { border-color: #4d80ff; box-shadow: 0 0 0 3px rgba(77,128,255,0.15); }

    button.action {
      padding: 10px 20px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.5);
      transition: all 0.18s ease;
      letter-spacing: 0.3px;
    }
    button.action:hover { border-color: rgba(255,255,255,0.3); color: #fff; background: rgba(255,255,255,0.08); }

    button.action.rate {
      background: linear-gradient(135deg, #1a44cc, #3a6fee);
      color: #fff;
      border-color: rgba(77,128,255,0.6);
      box-shadow: 0 3px 16px rgba(60,100,240,0.5);
    }
    button.action.rate:hover {
      background: linear-gradient(135deg, #1035bb, #2a5edd);
      box-shadow: 0 5px 22px rgba(60,100,240,0.7);
      transform: translateY(-1px);
    }
    button.action.accept {
      background: linear-gradient(135deg, #0f7040, #16a85c);
      color: #fff;
      border-color: rgba(22,168,92,0.5);
      box-shadow: 0 3px 16px rgba(20,160,80,0.4);
    }
    button.action.accept:hover {
      background: linear-gradient(135deg, #0a5a32, #0f9050);
      box-shadow: 0 5px 22px rgba(20,160,80,0.6);
      transform: translateY(-1px);
    }
    button.action.deny {
      background: linear-gradient(135deg, #991010, #d42020);
      color: #fff;
      border-color: rgba(220,40,40,0.5);
      box-shadow: 0 3px 16px rgba(200,30,30,0.4);
    }
    button.action.deny:hover {
      background: linear-gradient(135deg, #7a0a0a, #b81818);
      box-shadow: 0 5px 22px rgba(200,30,30,0.6);
      transform: translateY(-1px);
    }
    button.action.remove-staff {
      background: rgba(220,40,40,0.1);
      color: #ff7070;
      border-color: rgba(220,40,40,0.35);
      font-size: 0.75rem;
      padding: 5px 13px;
    }
    button.action.remove-staff:hover {
      background: rgba(220,40,40,0.2);
      border-color: rgba(220,40,40,0.6);
      transform: none;
    }

    .meta-line { font-size: 0.72rem; color: rgba(255,255,255,0.3); margin-top: 10px; }

    .status-tag {
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 5px;
      letter-spacing: 0.8px;
    }
    .status-tag.accepted {
      background: rgba(22,168,92,0.15);
      color: #22c46e;
      border: 1px solid rgba(22,168,92,0.3);
    }
    .status-tag.denied {
      background: rgba(220,40,40,0.12);
      color: #ff6b6b;
      border: 1px solid rgba(220,40,40,0.3);
    }

    /* ── Owner sort btn ──────────────────────────────── */
    .owner-sort-btn {
      background: linear-gradient(135deg, rgba(60,0,25,0.6), rgba(40,0,18,0.8));
      border: 1px solid rgba(180,30,60,0.4);
      color: rgba(255,100,130,0.9);
      padding: 11px 22px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
      letter-spacing: 0.3px;
    }
    .owner-sort-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(90,0,35,0.7), rgba(60,0,25,0.9));
      border-color: rgba(220,50,80,0.6);
      color: #ff8099;
      box-shadow: 0 3px 16px rgba(200,30,60,0.3);
    }
    .owner-sort-btn.locked {
      background: linear-gradient(135deg, #1a0a00, #0f0500);
      border: 1px solid rgba(255,180,40,0.35);
      color: rgba(255,190,60,0.7);
      cursor: default;
      opacity: 1;
      box-shadow: 0 0 14px rgba(255,160,30,0.1);
      font-style: italic;
    }

    .sorted-banner {
      display: none;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(180,120,0,0.12), rgba(100,60,0,0.18));
      border: 1px solid rgba(255,180,40,0.3);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
      box-shadow: 0 0 24px rgba(200,140,0,0.1);
    }
    .sorted-banner.visible { display: flex; }
    .sorted-banner-icon {
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .sorted-banner-text strong {
      display: block;
      font-size: 0.85rem;
      font-weight: 800;
      color: rgba(255,200,60,0.95);
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }
    .sorted-banner-text span {
      font-size: 0.75rem;
      color: rgba(255,180,40,0.55);
    }

    .group-title {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,180,50,0.8);
      margin: 28px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .group-title::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 14px;
      background: rgba(255,160,40,0.6);
      border-radius: 2px;
    }
  </style>
</head>

<body>

<header>
  <div class="header-logo">
    <img src="/sarkovialogo.png" alt="logo">
    <h1>Staff Dashboard</h1>
  </div>
  <div class="right">
    <div class="user-chip" id="userLabel" style="display:none;">
      <span class="dot"></span>
      <span id="userLabelText"></span>
    </div>
    <button class="logout" id="logoutBtn" style="display:none;">Log out</button>
  </div>
</header>

<div class="wrap">

  <div id="accessMsg" style="display:none;"></div>

  <div id="dashboard" style="display:none;">

    <div class="owner-panel" id="ownerPanel" style="display:none;">
      <h2>Owner Tools</h2>
      <div class="owner-row">
        <button class="tab-btn" id="genCodeBtn">Generate Invite Code</button>
        <div class="code-box" id="newCodeBox"></div>
      </div>
      <div class="code-list" id="codeList"></div>

      <div class="owner-divider"></div>

      <div class="owner-section-title">Sort Applications</div>
      <button class="owner-sort-btn" id="sortBtn">⬇ Sort by Rating (High → Low)</button>

      <div class="owner-divider"></div>

      <div class="owner-section-title">Staff Accounts</div>
      <div id="staffList" style="margin-bottom:16px;"></div>

      <div class="owner-divider"></div>

      <div class="owner-section-title">Danger Zone</div>
      <p style="font-size:0.78rem;color:rgba(255,255,255,0.3);margin:0 0 12px;">Permanently deletes all applications and ratings. Cannot be undone.</p>
      <button class="danger" id="clearBtn">⚠ Wipe All Applications</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-status="pending">Pending</button>
      <button class="tab-btn" data-status="accepted">Accepted</button>
      <button class="tab-btn" data-status="denied">Denied</button>
      <button class="tab-btn" data-status="all">All</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-type="all">All Types</button>
      <button class="filter-btn" data-type="written">Written</button>
      <button class="filter-btn" data-type="video">Video</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-rated="all">All</button>
      <button class="filter-btn" data-rated="no">Unrated by Me</button>
      <button class="filter-btn" data-rated="yes">Rated by Me</button>
    </div>

    <div class="sorted-banner" id="sortedBanner">
      <div class="sorted-banner-icon">🔒</div>
      <div class="sorted-banner-text">
        <strong>Applications Sorted</strong>
        <span>Rated highest to lowest. Accept or deny below.</span>
      </div>
    </div>

    <div id="loadingMsg">Loading applications…</div>
    <div id="emptyMsg" style="display:none;">No applications here.</div>
    <div id="list"></div>
  </div>

</div>

<script>
let currentStatus = "pending";
let currentType = "all";
let currentRated = "all";
let sortedView = false;
let lastApps = [];

async function init() {
  const res = await fetch("/api/admin/me");
  const me = await res.json();

  if (!me.loggedIn) {
    document.getElementById("accessMsg").style.display = "block";
    document.getElementById("accessMsg").innerHTML =
      `Please <a href="/admin/login">log in</a> to continue.`;
    return;
  }

  document.getElementById("userLabel").style.display = "flex";
  document.getElementById("userLabelText").textContent = `${me.username} · ${me.role}`;
  document.getElementById("logoutBtn").style.display = "inline-block";
  document.getElementById("dashboard").style.display = "block";

  if (me.isOwner) {
    document.getElementById("ownerPanel").style.display = "block";
    loadInviteCodes();
    loadStaffList();
  }

  loadApplications();
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await fetch("/api/admin/logout", { method: "POST" });
  window.location.href = "/admin/login";
});

document.querySelectorAll("[data-status]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-status]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentStatus = btn.dataset.status;
    loadApplications();
  });
});

document.querySelectorAll("[data-type]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-type]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.dataset.type;
    loadApplications();
  });
});

document.querySelectorAll("[data-rated]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-rated]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentRated = btn.dataset.rated;
    loadApplications();
  });
});

document.getElementById("sortBtn").addEventListener("click", () => {
  if (sortedView) return;
  if (!confirm("Sort applications by rating?\n\nDo this once everyone has finished rating.")) return;
  sortedView = true;
  const btn = document.getElementById("sortBtn");
  btn.textContent = "🔒 Sorted — Decision Mode Active";
  btn.classList.add("locked");
  btn.disabled = true;
  document.getElementById("sortedBanner").classList.add("visible");
  renderList(lastApps);
});

document.getElementById("genCodeBtn").addEventListener("click", async () => {
  const res = await fetch("/api/admin/generate-code", { method: "POST" });
  const data = await res.json();
  if (!res.ok) { alert(data.error || "Failed to generate code"); return; }

  const box = document.getElementById("newCodeBox");
  box.textContent = data.code;
  box.style.display = "inline-block";
  loadInviteCodes();
});

document.getElementById("clearBtn").addEventListener("click", async () => {
  if (!confirm("Wipe all applications and ratings? This can't be undone.")) return;

  const phrase = prompt('Type "DELETE ALL APPLICATIONS" to confirm:');
  if (phrase !== "DELETE ALL APPLICATIONS") {
    alert("Didn't match — nothing was deleted.");
    return;
  }

  const res = await fetch("/api/admin/clear-apps", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ confirmation: phrase })
  });
  const data = await res.json();

  if (!res.ok) { alert("Failed: " + (data.error || "unknown error")); return; }

  alert("All applications and ratings have been cleared.");
  loadApplications();
});

async function loadStaffList() {
  const res = await fetch("/api/admin/staff-list");
  if (!res.ok) return;
  const data = await res.json();
  const el = document.getElementById("staffList");
  if (!data.staff.length) { el.innerHTML = '<p class="meta-line">No staff accounts yet.</p>'; return; }
  el.innerHTML = data.staff.map(s => `
    <div class="code-row" style="padding:8px 0;">
      <span><code>${escapeHtml(s.username)}</code> <span class="used" style="margin-left:6px;">${s.role}</span></span>
      <button class="action remove-staff" data-staff-id="${s.id}" data-staff-name="${escapeHtml(s.username)}">Remove</button>
    </div>
  `).join("");
  el.querySelectorAll("[data-staff-id]").forEach(btn => {
    btn.addEventListener("click", () => removeStaff(btn.dataset.staffId, btn.dataset.staffName));
  });
}

async function removeStaff(id, name) {
  if (!confirm(`Remove ${name}?`)) return;
  const res = await fetch("/api/admin/remove-staff", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ staffId: id })
  });
  const data = await res.json();
  if (!res.ok) { alert("Failed: " + (data.error || "unknown error")); return; }
  loadStaffList();
}

async function loadInviteCodes() {
  const res = await fetch("/api/admin/invite-codes");
  if (!res.ok) return;
  const data = await res.json();
  document.getElementById("codeList").innerHTML = data.codes.map(c => `
    <div class="code-row">
      <code>${c.code}</code>
      <span class="${c.used_at ? 'used' : 'unused'}">${c.used_at ? 'Used by ' + escapeHtml(c.used_by) : 'Unused'}</span>
    </div>
  `).join("");
}

async function loadApplications() {
  const list = document.getElementById("list");
  const loading = document.getElementById("loadingMsg");
  const empty = document.getElementById("emptyMsg");

  loading.style.display = "block";
  empty.style.display = "none";
  list.innerHTML = "";

  let url = `/api/staff/applications?status=${currentStatus}&type=${currentType}`;
  if (currentRated !== "all") url += `&rated=${currentRated}`;

  const res = await fetch(url);
  const data = await res.json();
  loading.style.display = "none";

  lastApps = data.applications || [];

  if (!lastApps.length) {
    empty.style.display = "block";
    return;
  }

  renderList(lastApps);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderList(apps) {
  const list = document.getElementById("list");

  if (sortedView) {
    const written = apps.filter(a => a.type === "written").sort((a, b) => b.avg_score - a.avg_score);
    const video = apps.filter(a => a.type === "video").sort((a, b) => b.avg_score - a.avg_score);

    list.innerHTML = `
      <div class="group-title">Written — sorted by rating</div>
      ${written.length ? written.map(renderCard).join("") : '<p class="meta-line">None</p>'}
      <div class="group-title">Video — sorted by rating</div>
      ${video.length ? video.map(renderCard).join("") : '<p class="meta-line">None</p>'}
    `;
  } else {
    list.innerHTML = apps.map(renderCard).join("");
  }

  wireCardButtons();
}

function wireCardButtons() {
  document.querySelectorAll("[data-rate]").forEach(btn => {
    btn.addEventListener("click", () => submitRating(btn.dataset.rate));
  });
  document.querySelectorAll("[data-decide]").forEach(btn => {
    btn.addEventListener("click", () => decide(btn.dataset.decide, btn.dataset.decision));
  });
}

function renderCard(app) {
  const isWritten = app.type === "written";
  const submitted = new Date(app.submitted_at).toLocaleString();

  const statusTag = app.status !== "pending"
    ? `<span class="status-tag ${app.status}">${app.status}</span>`
    : "";

  const ignDisplay = app.ign !== null
    ? `<span class="ign">${escapeHtml(app.ign)} ${statusTag}</span>`
    : `<span class="ign hidden-id">🔒 Hidden until decided ${statusTag}</span>`;
  const discordDisplay = app.discord_username !== null
    ? `<span class="discord">@${escapeHtml(app.discord_username)}</span>`
    : `<span class="discord">🔒 Hidden until decided</span>`;

  const fieldsHtml = isWritten ? `
    <div class="field-row"><label>About</label><p>${escapeHtml(app.about)}</p></div>
    <div class="field-row"><label>Plans</label><p>${escapeHtml(app.plans)}</p></div>
    <div class="field-row"><label>Experience</label><p>${escapeHtml(app.experience)}</p></div>
    <div class="field-row"><label>RP — The Gold Strike</label><p>${escapeHtml(app.rp2)}</p></div>
    <div class="field-row"><label>RP — The Showdown</label><p>${escapeHtml(app.rp3 || '')}</p></div>
  ` : `
    <div class="field-row"><label>Video Link</label><p><a href="${escapeHtml(app.video_link)}" target="_blank">${escapeHtml(app.video_link)}</a></p></div>
  `;

  const myRatingLabel = app.my_score
    ? `<span style="font-size:0.75rem;color:var(--accent);font-weight:600;">Your rating: ${app.my_score}/10</span>`
    : `<span style="font-size:0.75rem;color:var(--text-dim);">You haven't rated</span>`;

  const decideButtons = sortedView ? `
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="action accept" data-decide="${app.id}" data-decision="accept">✓ Accept</button>
      <button class="action deny" data-decide="${app.id}" data-decision="deny">✕ Deny</button>
    </div>` : "";

  const actionsHtml = app.status === "pending" ? `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <input type="number" min="1" max="10" step="1" class="rate-input" id="rate-${app.id}" placeholder="1–10">
      <button class="action rate" data-rate="${app.id}">${app.my_score ? "Update My Rating" : "Submit Rating"}</button>
      ${myRatingLabel}
    </div>
    ${decideButtons}
  ` : `
    <span class="meta-line">Decided by ${escapeHtml(app.decided_by)} on ${new Date(app.decided_at).toLocaleString()}</span>
  `;

  return `
    <div class="card" id="card-${app.id}">
      <div class="card-top">
        <div class="card-id">
          <span class="type-badge ${app.type}">${isWritten ? "Written" : "Video"}</span>
          <div>
            <div>${ignDisplay}</div>
            <div>${discordDisplay}</div>
          </div>
        </div>
        <div class="score-pill">⭐ ${Number(app.avg_score).toFixed(1)}/10 (${app.rating_count} rating${app.rating_count !== 1 ? "s" : ""})</div>
      </div>

      ${fieldsHtml}

      <div class="card-actions">
        ${actionsHtml}
      </div>
      <div class="meta-line">Submitted ${submitted}</div>
    </div>
  `;
}

async function submitRating(applicationId) {
  const input = document.getElementById(`rate-${applicationId}`);
  const score = parseInt(input.value, 10);

  if (isNaN(score) || score < 1 || score > 10) {
    alert("Enter a score between 1 and 10.");
    return;
  }

  const res = await fetch("/api/staff/rate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ applicationId, score })
  });

  if (!res.ok) {
    const err = await res.json();
    alert("Failed to rate: " + (err.error || "unknown error"));
    return;
  }

  loadApplications();
}

async function decide(applicationId, decision) {
  if (!confirm(`${decision === "accept" ? "Accept" : "Deny"} this application?`)) return;

  const res = await fetch("/api/staff/decide", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ applicationId, decision })
  });

  const data = await res.json();
  if (!res.ok) {
    alert("Failed: " + (data.error || "unknown error"));
    return;
  }
  if (data.warning) alert(data.warning);

  loadApplications();
}

init();
</script>

</body>
</html>
