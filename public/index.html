<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>150 Player Pirate Civilization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;

      background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("https://static.planetminecraft.com/files/image/minecraft/project/2024/592/17901293-c_l.webp");

      background-size: cover;
      background-position: center;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(20, 20, 20, 0.9);
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      text-align: center;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      background: #1f1f1f;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #5865F2;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #4752c4;
    }

    .secondary {
      background: #444;
    }

    #thankYouMessage {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN PAGE -->
  <div id="loginPage">
    <h1>150 Player Pirate Civilization Event</h1>
    <p>Please login with Discord to continue</p>
    <a href="/login"><button>Login with Discord</button></a>
  </div>

  <!-- APPLICATION PAGE -->
  <div id="appPage" style="display:none;">
    <h1>150 Player Pirate Civilization Event</h1>

    <p>Logged in as <b id="username"></b></p>

    <a href="/logout"><button class="secondary">Logout</button></a>

    <hr>

    <form id="applicationForm">
      <input name="ign" id="ign" placeholder="Minecraft IGN" required>

      <input 
        name="discordName" 
        id="discordName" 
        placeholder="Discord Username"
        readonly
        required
      >

      <textarea name="plans" placeholder="What are your plans for this event?" required></textarea>

      <textarea name="experience" placeholder="Have you had any previous experience? If so, state any" required></textarea>

      <textarea name="contribution" placeholder="What will you contribute to this event?" required></textarea>

      <button type="submit">Submit Application</button>
    </form>

    <div id="thankYouMessage">
      <h2>Thank you for applying for Sarkovia Events!</h2>
      <p>You'll hear news about your application shortly.</p>
    </div>
  </div>

</div>

<script>
async function init() {
  const res = await fetch("/user");
  const user = await res.json();

  const loginPage = document.getElementById("loginPage");
  const appPage = document.getElementById("appPage");

  if (!user) {
    loginPage.style.display = "block";
    appPage.style.display = "none";
    return;
  }

  loginPage.style.display = "none";
  appPage.style.display = "block";

  let displayName = "Unknown User";

  if (user.global_name) {
    displayName = user.global_name;
  } else if (user.username && user.discriminator && user.discriminator !== "0") {
    displayName = `${user.username}#${user.discriminator}`;
  } else if (user.username) {
    displayName = user.username;
  }

  document.getElementById("username").innerText = displayName;
  document.getElementById("discordName").value = displayName;

  const form = document.getElementById("applicationForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(form).entries());

    const res = await fetch("/submit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    // ✅ ADDED: error handling
    if (!res.ok) {
      const text = await res.text();
      alert("Submission failed: " + text);
      return;
    }

    form.style.display = "none";
    document.getElementById("thankYouMessage").style.display = "block";
  });
}

init();
</script>

</body>
</html>
