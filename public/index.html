<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>150 Player Pirate Civilization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -10%;
      width: 120%;
      height: 120%;
      background: url("https://static.planetminecraft.com/files/image/minecraft/project/2024/592/17901293-c_l.webp");
      background-size: cover;
      background-position: center;
      animation: kenBurns 25s ease-in-out infinite alternate;
      z-index: -3;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.52);
      z-index: -2;
    }

    .bg-effects {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: rgba(60,35,5,0.13);
      box-shadow: inset 0 0 180px 60px rgba(0,0,0,0.7);
    }

    @keyframes kenBurns {
      0%   { transform: scale(1.0) translate(0%,0%); }
      33%  { transform: scale(1.04) translate(-1%,0.5%); }
      66%  { transform: scale(1.06) translate(0.5%,-1%); }
      100% { transform: scale(1.03) translate(-0.5%,0.5%); }
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1.4s ease;
    }

    #splash video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .container {
      background: rgba(20,20,20,0.9);
      padding: 30px;
      border-radius: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #5865F2 #1a1a1a;
    }

    /* NEW WELCOME BANNER */
    .welcome-banner {
      background: linear-gradient(135deg, rgba(120,0,0,0.95), rgba(180,20,20,0.9));
      border: 1px solid rgba(255,80,80,0.35);
      border-radius: 22px;
      padding: 18px 22px;
      margin-bottom: 24px;
      box-shadow:
        0 0 25px rgba(255,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
    }

    .welcome-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(255,255,255,0.08) 45%,
          transparent 100%
        );
      transform: translateX(-100%);
      animation: shine 5s linear infinite;
    }

    .welcome-banner h2 {
      margin: 0;
      color: #fff5f5;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
      position: relative;
      z-index: 1;
    }

    @keyframes shine {
      to {
        transform: translateX(100%);
      }
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 16px;
      border: none;
      background: #1f1f1f;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #5865F2, #7289da);
      color: white;
      cursor: pointer;
      margin-top: 10px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.4px;
      box-shadow: 0 4px 15px rgba(88,101,242,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #4752c4, #5865F2);
      box-shadow: 0 6px 20px rgba(88,101,242,0.6);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(88,101,242,0.4);
    }

    .secondary {
      background: #444;
      box-shadow: none;
    }

    .secondary:hover {
      background: #555;
      box-shadow: none;
    }

    .type-choice {
      display: flex;
      gap: 12px;
      margin: 16px 0;
    }

    .type-choice button {
      flex: 1;
      margin: 0;
      background: #1f1f1f;
      border: 2px solid #2a2a2a;
      box-shadow: none;
      font-size: 14px;
      transition: all 0.15s ease;
    }

    .type-choice button:hover {
      border-color: #5865F2;
      background: #2a2a2a;
      transform: none;
      box-shadow: none;
    }

    .type-choice button.active {
      border-color: #5865F2;
      background: linear-gradient(135deg, #5865F2, #7289da);
      box-shadow: 0 4px 15px rgba(88,101,242,0.4);
    }

    hr {
      border: none;
      height: 1px;
      background: linear-gradient(to right, transparent, #5865F2, transparent);
      margin: 20px 0;
      opacity: 0.6;
    }

    .container::-webkit-scrollbar {
      width: 6px;
    }

    .container::-webkit-scrollbar-track {
      background: #1a1a1a;
      border-radius: 10px;
    }

    .container::-webkit-scrollbar-thumb {
      background: #5865F2;
      border-radius: 10px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      opacity: 0;
      animation: fadeInUp 0.6s ease forwards;
    }

    .discord-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0.9;
    }

    .discord-badge:hover {
      transform: scale(1.08);
      opacity: 1;
    }

    .discord-badge img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>

<body>

<div id="splash">
  <video id="splashVideo" autoplay muted playsinline>
    <source src="/intro.mp4" type="video/mp4">
  </video>
</div>

<div class="bg-effects"></div>

<div class="container">

  <!-- NEW TITLE BOX -->
  <div class="welcome-banner fade-in" style="animation-delay:0.05s;">
    <h2>Welcome to Sarkovia Events</h2>
  </div>

  <!-- LOGIN PAGE -->
  <div id="loginPage">
    <h1 class="fade-in" style="animation-delay:0.1s;">
      150 Player Pirate Civilization Event
    </h1>

    <p class="fade-in" style="animation-delay:0.4s;">
      Please login with Discord to continue
    </p>

    <div class="fade-in" style="animation-delay:0.7s;">
      <a href="/login">
        <button>Login with Discord</button>
      </a>
    </div>
  </div>

</div>

<a href="https://discord.gg/sarkovia" target="_blank" class="discord-badge" title="Join our Discord">
  <img src="/sarkovialogo.png" alt="Sarkovia Discord">
</a>

</body>
</html>
